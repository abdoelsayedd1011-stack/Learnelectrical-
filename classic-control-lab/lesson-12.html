<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تشغيل متتابع أوتوماتيك بالتايمر | كورس الكنترول الكلاسيك | LearnElectricals</title>
<meta name="description" content="كورس كنترول تفاعلي: الأزرار والكونتاكتور والأوفرلود والموتور، ثم دوائر التشغيل بالترتيب، ثم التايمر ودوائره مثل الستار/دلتا. كل دائرة مرسومة قوى وتحكم وشكل لوحة، وتشتغل لما تضغط تشغيل.">
<link rel="canonical" href="https://www.learnelectricals.com/classic-control-lab/lesson-12.html">
<link rel="alternate" hreflang="ar" href="https://www.learnelectricals.com/classic-control-lab/lesson-12.html">
<link rel="alternate" hreflang="en" href="https://www.learnelectricals.com/en/classic-control-lab/lesson-12.html">
<link rel="alternate" hreflang="x-default" href="https://www.learnelectricals.com/classic-control-lab/lesson-12.html">
<meta name="theme-color" content="#0b1013">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Readex+Pro:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/classic-control-lab/cc.css?v=20261113cd">
</head>
<body>

<div class="wrap">
  <header>
    <div class="ht">
      <h1 data-t="title"></h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="row hdrbtns"><a id="homeA" class="hbtn" href="/" hidden></a><a id="hubA" class="hbtn" href="index.html" hidden></a>
    <button id="langBtn" type="button" aria-label="Language">English</button></div>
  </header>

  <nav class="units" id="units" aria-label="lessons"></nav>

  <section class="simgrid">
    <div class="scene card">
      <div class="scenehead">
        <h2 id="cTitle"></h2>
        <div class="row">
          <div class="row" id="viewTg">
            <button type="button" id="vDia" class="sel" data-t="vDia"></button>
            <button type="button" id="vPan" class="sel" data-t="vPan"></button>
          </div>
          <span id="cState" class="pill off"></span>
        </div>
      </div>
      <div id="cScene">
        <div id="diaWrap">
          <div class="diagrams" id="diagrams">
            <figure><figcaption data-t="power"></figcaption><svg id="pw" role="img" aria-label="power circuit"></svg></figure>
            <figure class="figc"><figcaption data-t="control"></figcaption><svg id="ct" role="img" aria-label="control circuit"></svg></figure>
          </div>
          <div class="legend">
            <span><i style="background:var(--live)"></i><span data-t="lgLive"></span></span>
            <span><i style="background:var(--flow)"></i><span data-t="lgFlow"></span></span>
            <span><i style="background:var(--dead)"></i><span data-t="lgDead"></span></span>
            <span><i style="background:var(--nrail)"></i><span data-t="lgN"></span></span>
            <span data-t="lgTp"></span>
          </div>
        </div>
        <figure id="pnFig" class="pnfig"><figcaption data-t="panelCap"></figcaption><div class="pnscroll"><svg id="pn" role="img" aria-label="panel"></svg></div></figure>
      </div>
      <div id="dScene" hidden><figure class="dvfig"><div class="pnscroll"><svg id="dv" role="img" aria-label="device"></svg></div></figure></div>
    </div>

    <aside class="side">
      <div id="sideD" class="sidegrp" hidden></div>
      <div id="sideC" class="sidegrp">
      <div class="card">
        <h2 data-t="mode"></h2>
        <div class="seg">
          <button type="button" id="mFree" class="sel" data-t="free"></button>
          <button type="button" id="mTrace" data-t="trace"></button>
        </div>
      </div>

      <div class="card">
        <h2><span data-t="station"></span><span class="note" data-t="holdHint"></span></h2>
        <div class="station">
          <div class="lamps" id="lamps"></div>
          <div class="btns" id="btns"></div>
          <div id="selWrap" class="selw" hidden></div>
        </div>
        <label class="chk" style="margin-top:8px"><input type="checkbox" id="latch"><span data-t="latch"></span></label>
      </div>

      <div class="card" id="timerCard" hidden style="display:grid;gap:10px">
        <h2 data-t="timers"></h2>
        <div id="timerList" style="display:grid;gap:10px"></div>
      </div>

      <div class="card" id="procCard" hidden style="display:grid;gap:10px"></div>

      <div class="card" style="display:grid;gap:10px">
        <h2 data-t="supplyBox"></h2>
        <div class="sw"><span data-t="mains"></span><button type="button" id="bMains"></button></div>
        <div class="sw"><span data-t="q1"></span><button type="button" id="bQ1"></button></div>
        <div class="ctl"><label for="rLoad"><span data-t="load"></span><span class="mono" id="vLoad"></span></label><input type="range" id="rLoad" min="0" max="200" step="5" value="70"></div>
        <div class="ctl"><label for="rIr"><span data-t="ir"></span><span class="mono" id="vIr"></span></label><input type="range" id="rIr" min="4" max="16" step="0.5" value="11"><span class="note" id="irNote"></span></div>
        <div class="ctl"><label><span data-t="heat"></span><span class="mono" id="vHeat"></span></label><div class="bar"><i id="heatBar"></i></div></div>
        <div id="resetBtns" class="row"></div>
        <span class="note" id="resetNote"></span>
      </div>

      <div class="card" id="faultCard">
        <h2><span data-t="faults"></span><button type="button" id="bClear" data-t="clear" style="font-size:12px;padding:4px 10px"></button></h2>
        <div class="flist" id="flist"></div>
      </div>

      <div class="card" id="traceCard" hidden>
        <h2><span data-t="traceTitle"></span><span class="pill in" id="score"></span></h2>
        <div style="display:grid;gap:8px">
          <div class="msg in" data-t="traceIntro"></div>
          <label for="suspect" class="note" data-t="suspect"></label>
          <select id="suspect"></select>
          <div class="row"><button type="button" id="bCheck" data-t="check"></button><button type="button" id="bNew" data-t="newFault"></button><button type="button" id="bShow" data-t="showAns"></button></div>
          <div id="traceMsg"></div>
        </div>
      </div>

      <div class="card">
        <div class="meter">
          <div class="mh"><span data-t="meter"></span><button type="button" id="bProbes" data-t="meterClear"></button></div>
          <div class="lcd" id="lcd">-- <small>V~</small></div>
          <div class="probes"><span><i style="background:#111;border:1px solid #fff"></i>COM: <b id="pB">—</b></span><span><i style="background:#d33"></i>V: <b id="pR">—</b></span></div>
        </div>
        <p class="note" style="margin:8px 0 0" data-t="meterHint"></p>
      </div>
      </div>
    </aside>

    <div class="below">
      <div id="belowD" class="sidegrp" hidden></div>
      <div id="belowC" class="sidegrp">
      <div class="tiles" id="tiles">
        <div class="tile"><span class="k" data-t="tMotor"></span><span class="v txt" id="tMotor"></span></div>
        <div class="tile"><span class="k" data-t="tSpeed"></span><span class="v" id="tSpeed"></span></div>
        <div class="tile"><span class="k" data-t="tCur"></span><span class="v" id="tCur"></span></div>
        <div class="tile"><span class="k" data-t="tHeat"></span><span class="v" id="tHeat"></span></div>
        <div class="tile"><span class="k" data-t="tCtrl"></span><span class="v txt" id="tCtrl"></span></div>
        <div class="tile" id="tProcW" hidden><span class="k" id="tProcK"></span><span class="v txt" id="tProc"></span></div>
      </div>
      <div class="c2">
        <div class="card"><h2 data-t="steps"></h2><ol class="steps" id="steps"></ol></div>
        <div class="card"><h2 data-t="log"></h2><ul class="log" id="log"></ul></div>
      </div>
      <div class="card"><h2 data-t="devices"></h2><div class="tbl"><table><thead><tr><th data-t="thTag"></th><th data-t="thDesc"></th><th data-t="thState"></th></tr></thead><tbody id="devs"></tbody></table></div></div>
      </div>
    </div>
  </section>

  <section class="learn">
    <div class="card"><h2 data-t="explain"></h2><div id="explain"></div></div>
    <div style="display:grid;gap:16px">
      <div class="card"><h2 data-t="challenges"></h2><ul class="chal" id="chal"></ul></div>
      <div class="card"><h2 data-t="quiz"></h2><div class="quiz" id="quiz"></div></div>
    </div>
  </section>
  <nav class="row" id="pager" style="justify-content:space-between"></nav>
</div>

<script>window.CC_PAGES=1;window.CC_LESSON="tseq";window.CC_LANG="ar";</script>
<script src="/classic-control-lab/cc.js?v=20261113cd"></script>
</body>
</html>
